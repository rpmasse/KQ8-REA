[package]
name = "kq8-viewer"
description = "Shows one KQ8 model in a window (M1 step 1)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "kq8-viewer"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
kq8-data.workspace = true
kq8-core.workspace = true
kq8-audio.workspace = true
bevy.workspace = true
winit = { version = "=0.30.13", default-features = false }
crossterm.workspace = true
mimalloc.workspace = true
libmimalloc-sys.workspace = true

[dev-dependencies]
# The ignored Windows GPU regression uses the same wgpu as locked Bevy;
# production Bevy unifies the native backend features.
wgpu = { version = "=30.0.1", default-features = false, features = ["wgsl"] }
